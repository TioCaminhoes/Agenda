    <button id="botao" onclick="mudarCor()">Mudar Cor</button>
</div>
<script>
    const header = document.querySelector('header');
    const botao = document.querySelector('#botao');
    header.style.color = 'red';
    function mudarCor() {
        if (header.style.color == 'red') {
            header.style.color = 'green';
            botao.textContent = 'Mudar Cor para vermelho';

        } else {
            header.style.color = 'red';
            botao.textContent = 'Mudar Cor para verde';
        }
    }
</script>
